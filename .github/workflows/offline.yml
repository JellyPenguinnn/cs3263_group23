name: Installed baseline checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation .
      - name: Verify installed prompts and runtime assets
        run: python scripts/check_installed.py
      - run: python -m pytest -q
      - name: Verify every preserved benchmark study
        run: |
          for manifest in results/evidence-manifest.json results/difficulty-evidence-manifest.json results/balanced-evidence-manifest.json results/diverse-evidence-manifest.json; do
            python scripts/verify_evidence.py --manifest "$manifest"
          done
      - run: python -m pip check
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Dashboard frontend checks
        run: |
          node --check src/scheduling/dashboard/static/app.js
          node --test tests/frontend/dashboard.test.cjs
      - name: Generate and independently check the full development reference set
        run: |
          scheduling benchmark-generate --output artifacts/development.json
          scheduling evaluate-plan --cases artifacts/development.json --config configs/development/main-baseline.json --output artifacts/preflight.json > artifacts/preflight.stdout.json
      - name: Qualify v2 generation, both pipelines, resume and replay offline
        run: python evaluation/v2_qualification.py artifacts/v2-qualification
      - name: Qualify v3 challenge cases and request boundary offline
        run: python evaluation/v2_qualification.py artifacts/v3-qualification --version 3
      - name: Qualify authored development cases through both pipelines offline
        run: python evaluation/v2_qualification.py artifacts/authored-qualification --cases benchmarks/fixtures/realistic-drafts-v1.json
      - name: Verify report build in its separate document environment
        run: |
          python -m venv .venv-docs
          .venv-docs/bin/python -m pip install -r requirements-docs.txt
          .venv-docs/bin/python scripts/render_report.py --output artifacts/report-check/report.pdf
          .venv-docs/bin/python scripts/check_report.py --pdf artifacts/report-check/report.pdf --receipt artifacts/report-check/format.json

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cs3263-scheduling"
version = "0.1.0"
description = "Group 23 scheduling comparison: provider and direct baseline components"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx==0.28.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "setuptools==80.9.0", "wheel==0.45.1"]
solver = ["ortools==9.14.6206"]

[project.scripts]
scheduling = "scheduling.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/cs3263-scheduling/prompts/extraction" = ["prompts/extraction/specification.txt"]
"share/cs3263-scheduling/prompts/direct" = ["prompts/direct/generation.txt", "prompts/direct/repair.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
